# The SQL character set (25-coverage-graft.md §0b, F22 from ADR 0023).
#
# Calcite 1.42 has no charset setting on SqlParser.Config or on the type factory. Its character set
# is the system property `calcite.default.charset`, defaulting to ISO-8859-1, read once when
# org.apache.calcite.config.CalciteSystemProperty initialises and cached in
# org.apache.calcite.util.Util.DEFAULT_CHARSET (V47). CalciteSystemProperty seeds itself from this
# file on the classpath and then overlays any `calcite.*`, `saffron.*` or `net.sf.saffron.*` system
# property on top -- so this is the setting that cannot lose a class-initialisation race, and an
# operator can still override it with -Dcalcite.default.charset=... on the command line.
#
# ISO-8859-1 refused a string literal outside Latin-1 -- WHERE symbol = '株式' failed to plan while
# the same value in a column read and compared correctly. UTF-8 is what Chalk's IR, its executor and
# its Utf8String already are.
calcite.default.charset=UTF-8
calcite.default.nationalcharset=UTF-8
