name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  proto:
    name: proto (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: buf lint
        run: buf lint
        working-directory: proto
      - name: buf format check
        run: buf format --diff --exit-code
        working-directory: proto
      - name: buf breaking (against the latest release tag)
        run: |
          tag="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          if [ -z "$tag" ]; then
            echo "::notice::no release tag yet — breaking-change check skipped (02-ir.md §2 pre-release freedom)"
            exit 0
          fi
          buf breaking --against "../.git#tag=$tag,subdir=proto"
        working-directory: proto

  planner:
    name: planner (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: gradle build
        run: ./gradlew build
        working-directory: planner
      - name: upload shadow jar
        uses: actions/upload-artifact@v4
        with:
          name: chalk-planner-jar
          path: planner/build/libs/chalk-planner-*-all.jar
          if-no-files-found: error
      - name: upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-test-report
          path: planner/build/reports/tests/test
          if-no-files-found: ignore

  dotnet:
    name: dotnet (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: build
        run: dotnet build dotnet/Chalk.slnx -c Release
      - name: test
        run: |
          set -e
          for p in Chalk.Ir.Tests Chalk.Catalog.Tests Chalk.Sources.Poco.Tests \
                   Chalk.Sources.Ado.Tests Chalk.Execution.Tests Chalk.Architecture.Tests; do
            dotnet test "dotnet/tests/$p" -c Release --no-build
          done
      - name: verify the recorded corpus
        run: dotnet run --project dotnet/tools/Chalk.CorpusTool -c Release --no-build -- verify --corpus corpus

  integration:
    name: integration (client + sidecar)
    runs-on: ubuntu-latest
    needs: [planner, dotnet]
    # The whole suite, including the conformance kit's PostgreSQL leg: PostgresFixture finds the
    # binaries this image already carries at /usr/lib/postgresql/16/bin and starts a cluster of its
    # own, so there is no service container and no `sudo systemctl` (D133). REQUIRED=1 turns a
    # missing PostgreSQL into a failure, so the leg cannot be lost quietly.
    env:
      CHALK_TEST_POSTGRES_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: dotnet/global.json
      - name: download shadow jar
        uses: actions/download-artifact@v4
        with:
          name: chalk-planner-jar
          path: planner/build/libs
      - name: build
        run: dotnet build dotnet/Chalk.slnx -c Release
      - name: integration tests (unix socket, the default)
        # SidecarFixture resolves planner/build/libs/chalk-planner-*-all.jar, which is where the
        # downloaded artifact lands, and launches it through PlannerProcess, which is the only way
        # a sidecar is ever started (D21, D133).
        run: dotnet test dotnet/tests/Chalk.Integration.Tests -c Release --no-build
      - name: integration tests (tcp)
        # A host that runs the sidecar on another machine gets TCP (09-unix-socket-transport.md §6),
        # so the whole suite runs over it too rather than only the two TransportTests cases.
        env:
          CHALK_PLANNER_TRANSPORT: tcp
        run: dotnet test dotnet/tests/Chalk.Integration.Tests -c Release --no-build
      - name: the conformance reports
        if: always()
        run: |
          for report in corpus/conformance/*.txt; do
            echo "::group::$report"
            cat "$report"
            echo "::endgroup::"
          done
      - name: the README quickstart still works
        run: ./scripts/quickstart.sh

